<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STRIP - Wear Your Style</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#fff;
    color:#111;
}

header{
    background:#000;
    color:#fff;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:32px;
    font-weight:bold;
    letter-spacing:5px;
}

nav a{
    color:#fff;
    text-decoration:none;
    margin-left:25px;
}

.hero{
    height:90vh;
    background:url('https://images.unsplash.com/photo-1523398002811-999ca8dec234') center/cover;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.hero-content{
    background:rgba(0,0,0,.6);
    padding:40px;
    color:#fff;
}

.hero h1{
    font-size:60px;
}

.hero p{
    margin:15px 0;
}

.btn{
    display:inline-block;
    background:#fff;
    color:#000;
    padding:12px 30px;
    text-decoration:none;
    font-weight:bold;
}

.products{
    padding:80px 8%;
}

.section-title{
    text-align:center;
    font-size:40px;
    margin-bottom:50px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    border:1px solid #ddd;
}

.card img{
    width:100%;
    height:350px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.price{
    font-weight:bold;
    margin-top:10px;
}

footer{
    background:#000;
    color:#fff;
    text-align:center;
    padding:30px;
    margin-top:50px;
}
</style>
</head>

<body>

<header>
    <div class="logo">STRIP</div>

    <nav>
        <a href="#">Accueil</a>
        <a href="#">Boutique</a>
        <a href="#">Nouveautés</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <div class="hero-content">
        <h1>STRIP</h1>
        <p>WEAR YOUR STYLE</p>
        <a href="#" class="btn">Découvrir</a>
    </div>
</section>

<section class="products">
    <h2 class="section-title">Collection</h2>

    <div class="grid">

        <div class="card">
            <img src="tshirt.jpg">
            <div class="card-content">
                <h3>STRIP T-Shirt</h3>
                <div class="price">199 MAD</div>
            </div>
        </div>

        <div class="card">
            <img src="hoodie.jpg">
            <div class="card-content">
                <h3>STRIP Hoodie</h3>
                <div class="price">399 MAD</div>
            </div>
        </div>

        <div class="card">
            <img src="jeans.jpg">
            <div class="card-content">
                <h3>STRIP Jeans</h3>
                <div class="price">349 MAD</div>
            </div>
        </div>

    </div>
</section>

<footer>
    © 2026 STRIP - Wear Your Style
</footer>

</body>
</html>
